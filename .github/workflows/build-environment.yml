# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Install and Tests

on: [workflow_call]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build venv
      run: |
        python -m venv .venv
    - name: Install dependencies
      run: |
        . ./.venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install .[lint,test]
    - name: Write package version
      run: |
        . ./.venv/bin/activate
        version=$(python -c "import dritimeseriesprocessor; print(dritimeseriesprocessor.__version__)")
        echo "VERSION: ${version}"
        echo $version > /tmp/package-version.txt
    - name: Zip environment
      run: tar -cvf python-environment.tar ./venv
    - name: Upload package version as artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-version
        path: /tmp/package-version.txt
    - name: Upload environment as artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-environment
        path: python-environment.tar
        retention-days: 1
      