name: Auto-bump patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging

permissions:
  contents: write
  pull-requests: read

jobs:
  bump:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Decide whether to bump
        id: decide
        run: |
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            range="${{ github.event.before }} ${{ github.event.after }}"
            scope="latest push"
          else
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            base_sha=$(git rev-parse "origin/${{ github.event.pull_request.base.ref }}")
            range="$base_sha HEAD"
            scope="full PR diff vs ${{ github.event.pull_request.base.ref }}"
          fi
          if git diff --name-only $range | grep -q '^pyproject\.toml$'; then
            echo "pyproject.toml changed in $scope - skipping auto-bump"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.decide.outputs.bump == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        if: steps.decide.outputs.bump == 'true'

      - name: Bump patch and push
        if: steps.decide.outputs.bump == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          python scripts/bump.py patch --no-changelog
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
