name: Build the Docker Image

on: [workflow_call]
    
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check file existence
        id: check_file
        run: |
          if [ -f "Dockerfile" ]; then
            file_exists="true"
          else
            file_exists="false"
          fi

          echo "file_exists=${file_exists}" >> $GITHUB_OUTPUT
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Build image name
        if: steps.check_file.outputs.file_exists == 'true'
        id: build-docker-image
        env:
          IMAGE_NAME: ${{ github.event.repository.name }}
        run: |
          IMAGE_TAG=$(python -c "import dritimeseriesprocessor; print(dritimeseriesprocessor.__version__)")
          FULL_IMAGE=${IMAGE_NAME}:${IMAGE_TAG}
          echo "FULL_IMAGE=${FULL_IMAGE}" > /tmp/image-name.txt
          echo "FULL_IMAGE: ${FULL_IMAGE}"
          docker build -t $FULL_IMAGE .
          docker save --output /tmp/image.tar $FULL_IMAGE
      - name: Upload docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
      - name: Upload docker image name as artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-name
          path: /tmp/image-name.txt

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download docker image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - name: Download docker image name
        uses: actions/download-artifact@v4
        with:
          name: image-name
          path: /tmp
      - name: Load image
        run: |
          docker load --input /tmp/image.tar
          docker image ls -a
          source /tmp/image-name.txt
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Run Docker Image
        run: docker run --name test-container -d $IMAGE_NAME
      - name: Check container is running
        run: sleep 5 && docker ps -a
      - name: Check if container has exited already
        run: |
          if docker ps -a | grep -q "Exited"; then
            echo "Container exited. probably broken"
            exit 1
          else
            echo "Container still running, should be okay."
          fi
      - name: Stop and remove container
        run: |
          docker stop test-container
          docker rm test-container



