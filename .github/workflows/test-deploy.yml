name: Deploy the Docker Image to ECR

on:
  workflow_call:
    secrets:
      AWS_REGION:
        required: true
      AWS_ROLE_ARN:
        required: true
    
permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download docker image
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ./.github/workflows/test-docker.yml
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow_conclusion: success
          name: image
          path: /tmp
