[build-system]
requires = ["setuptools >= 61.0", "autosemver"]

[project]
requires-python = ">=3.12"
dependencies = [
    "autosemver",
    "boto3>=1.34.138",
    "boto3-stubs[s3]",
    "config>=0.5.1",
    "dri-utils",
    "httpx",
    "moto>=5.0.10",
    "polars>=1.1.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.2",
    "isodate",
    "duckdb>=1.1.2",
    "pandas",
    "tenacity",
    "prometheus-client",
    "setuptools < 81",
    "time-stream",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
]
name = "dritimeseriesprocessor"
dynamic = ["version"]
authors = [
    { name = "Dom Ginger", email = "domgin@ceh.ac.uk" },
    { name = "Nathan Shaw", email = "natsha@ceh.ac.uk" },
    { name = "Lewis Chambers", email = "lewcha@ceh.ac.uk" },
    { name = "Rod Scott", email = "rjsc@ceh.ac.uk" },
    { name = "Simon Stanley", email = "simsta@ceh.ac.uk" },
    { name = "Richard Smith", email = "ricsmi@ceh.ac.uk" },
]
description = "Timeseries processor service for FDRI."
readme = "README.md"
license = { text = "NO LICENSE" }

[dependency-groups]
test = ["pytest", "pytest-cov", "freezegun", "awscli-local == 0.22.0", "pytest-socket"]
docs = ["sphinx", "sphinx-copybutton", "sphinx-rtd-theme", "nbsphinx"]
lint = ["ruff"]
dev = [
  { include-group = "test"},
  { include-group = "docs"},
  { include-group = "lint"},
]

[tool.setuptools.dynamic]
version = { attr = "dritimeseriesprocessor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dritimeseriesprocessor*", "databuilder*", "metadata_manager*", "new_processor*"]

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "."]
addopts = "--cov=dritimeseriesprocessor --cov=new_processor --cov-report=term-missing --disable-socket --allow-hosts=127.0.0.1,::1"
markers = ["slow: Marks slow tests"]
filterwarnings = [
    "ignore::Warning:autosemver.*:",
    "ignore::Warning:pkg_resources.*:",
]

[tool.coverage.run]
source = [
    "src/dritimeseriesprocessor",
    "src/new_processor"
]
omit = [
    "*__init__.py",
    "src/dritimeseriesprocessor/__main__.py",
    "src/dritimeseriesprocessor/metrics_exporter.py",
]

[tool.ruff]
src = ["src", "tests"]
include = ["src/**.py", "testing/**.py", "tests/**.py"]
line-length = 120
exclude = []

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "A",
    "PLC",
    "PLE",
    "PLW",
    "I",
    "N816",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN205",
    "ANN206",
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.uv.sources]
time-stream = { git = "https://github.com/NERC-CEH/time-stream.git" }
dri-utils = { git = "https://github.com/NERC-CEH/dri-utils.git" }
