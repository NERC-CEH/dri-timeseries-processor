[build-system]
requires = [
    "setuptools >= 61.0,<81",
    "autosemver"
]

[project]
name = "dritimeseriesprocessor"
requires-python = ">=3.12"
description = "Timeseries processor service."
readme = "README.md"
license = { text = "NO LICENSE" }
dynamic = ["version"]
authors = [
    { name = "Lewis Chambers", email = "lewcha@ceh.ac.uk" },
    { name = "Dom Ginger", email = "domgin@ceh.ac.uk" },
    { name = "Samantha Hewkin", email = "samhew@ceh.ac.uk" },
    { name = "Rod Scott", email = "rjsc@ceh.ac.uk" },
    { name = "Nathan Shaw", email = "natsha@ceh.ac.uk" },
    { name = "Richard Smith", email = "ricsmi@ceh.ac.uk" },
    { name = "Simon Stanley", email = "simsta@ceh.ac.uk" },
    { name = "Oliver Swain", email = "os@ceh.ac.uk" },
]
dependencies = [
    "boto3>=1.34.138",
    "boto3-stubs[s3]",
    "config>=0.5.1",
    "duckdb>=1.1.2",
    "dri-utils @ git+https://github.com/NERC-CEH/dri-utils.git",
    "httpx",
    "isodate",
    "polars>=1.1.0",
    "prometheus-client",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.2",
    "tenacity",
    "time-stream"
]


[dependency-groups]
test = [
    "awscli-local == 0.22.0",
    "freezegun",
    "moto>=5.0.10",
    "pytest",
    "pytest-cov",
    "pytest-socket"
]
docs = []
lint = [
    "ruff"
]
dev = [
  { include-group = "test"},
  { include-group = "docs"},
  { include-group = "lint"},
]

[tool.setuptools.dynamic]
version = { attr = "dritimeseriesprocessor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dritimeseriesprocessor*", "databuilder*"]

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "."]
addopts = "--cov=dritimeseriesprocessor --cov-report=term-missing --disable-socket --allow-hosts=127.0.0.1,::1"
markers = ["slow: Marks slow tests"]
filterwarnings = [
    "ignore::Warning:autosemver.*:",
    "ignore::Warning:pkg_resources.*:",
]

[tool.coverage.run]
source = [
    "src/dritimeseriesprocessor",
]
omit = [
    "*/dritimeseriesprocessor/routers/metadata/flux_metadata_loader.py",
    "*/dritimeseriesprocessor/routers/metadata/local_eddypro_metadata_source.py",
]

[tool.ruff]
src = ["src", "tests"]
include = ["src/**.py", "tests/**.py"]
line-length = 120
exclude = []

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "A",
    "PLC",
    "PLE",
    "PLW",
    "I",
    "N816",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN205",
    "ANN206",
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.uv.sources]
time-stream = { git = "https://github.com/NERC-CEH/time-stream.git" }
