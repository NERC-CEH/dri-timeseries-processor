[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dri-timeseries-processor"
version = "0.6.3"
description = "Timeseries processor service."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Oladimeji Awe", email = "olaawe@ceh.ac.uk" },
    { name = "Lewis Chambers", email = "lewcha@ceh.ac.uk" },
    { name = "Leanne Durkan", email = "leadur@ceh.ac.uk" },
    { name = "Dom Ginger", email = "domgin@ceh.ac.uk" },
    { name = "Samantha Hewkin", email = "samhew@ceh.ac.uk" },
    { name = "Josh Holland", email = "joshol@ceh.ac.uk" },
    { name = "Hamayoon Khan", email = "hamkha@ceh.ac.uk" },
    { name = "Nathan Shaw", email = "natsha@ceh.ac.uk" },
    { name = "Richard Smith", email = "ricsmi@ceh.ac.uk" },
    { name = "Simon Stanley", email = "simsta@ceh.ac.uk" },
    { name = "Oliver Swain", email = "os@ceh.ac.uk" },
]
maintainers = [
    { name = "Leanne Durkan", email = "leadur@ceh.ac.uk" },
    { name = "Dom Ginger", email = "domgin@ceh.ac.uk" },
    { name = "Samantha Hewkin", email = "samhew@ceh.ac.uk" },
    { name = "Josh Holland", email = "joshol@ceh.ac.uk" },
    { name = "Hamayoon Khan", email = "hamkha@ceh.ac.uk" },
    { name = "Nathan Shaw", email = "natsha@ceh.ac.uk" },
    { name = "Richard Smith", email = "ricsmi@ceh.ac.uk" },
    { name = "Simon Stanley", email = "simsta@ceh.ac.uk" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "boto3>=1.43.31",
    "boto3-stubs[s3]",
    "config>=0.5.1",
    "duckdb>=1.5.4",
    "dri-utils @ git+https://github.com/NERC-CEH/dri-utils.git",
    "httpx",
    "isodate",
    "polars>=1.1.0",
    "prometheus-client",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.2",
    "tenacity",
    "time-stream",
]

[project.urls]
bugs = "https://github.com/NERC-CEH/dri-timeseries-processor/issues"
changelog = "https://github.com/NERC-CEH/dri-timeseries-processor/releases"
homepage = "https://github.com/NERC-CEH/dri-timeseries-processor"

[dependency-groups]
test = [
    "awscli-local==0.22.2",
    "coverage",
    "freezegun",
    "moto>=5.2.2",
    "pytest",
    "pytest-cov",
    "pytest-socket",
]
lint = [
    "ruff",
]
typecheck = [
    "pyright",
]
docs = []
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "docs" },
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dritimeseriesprocessor"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --disable-socket --allow-hosts=127.0.0.1,::1"
markers = ["slow: Marks slow tests"]
filterwarnings = [
    "ignore:pkg_resources is deprecated:UserWarning",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/"]
omit = [
    "*/dritimeseriesprocessor/routers/metadata/flux_metadata_loader.py",
    "*/dritimeseriesprocessor/routers/metadata/local_eddypro_metadata_source.py",
    "src/*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "except PackageNotFoundError",
    "if __name__ == .__main__.",
    "\\.\\.\\.",
]

[tool.ruff]
src = ["src", "tests"]
include = ["src/**.py", "tests/**.py"]
line-length = 120
exclude = []

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "A",
    "PLC",
    "PLE",
    "PLW",
    "I",
    "N816",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN205",
    "ANN206",
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.uv]
package = true
default-groups = ["dev"]

[tool.uv.sources]
time-stream = { git = "https://github.com/NERC-CEH/time-stream.git" }
