# pre-commit-local.yaml
# Personal, manual-only checks you can run on demand.
# Add this file to .gitignore. Do NOT run `pre-commit install -c pre-commit-local.yaml`.
#
# To run all hooks in this file:
#   pre-commit run --config .githooks/pre-commit-local.yml --all-files
# To run a specific hook (example):
#   pre-commit run --hook-stage manual --config .githooks/pre-commit-local.yml --all-files
# To run your pipeline example:
#   python -m dritimeseriesprocessor from-selection --network cosmos --end-date 2020-08-20 --selection cosmos-holln PE P1D

repos:
  # --- QUICK SAFETY CHECKS (built-in hooks) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
        name: Check for unresolved merge conflict markers
        stages: [manual]

      # Also catches 'pdb' debug statements etc.
      - id: debug-statements
        name: Check for debug statements
        stages: [manual]

  # --- SPELL CHECK (staged files only) ---
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        name: Spell check (staged files)
        args:
          - --skip=*.lock,*.json,*.csv,*.tsv,*.parquet,*.svg,*.png,*.jpg,*.jpeg,*.gif,*.pdf
          - --quiet-level=2
          # Optional: add a personal dictionary file:
          # - --ignore-words=./.codespell.ignore
        stages: [manual]

  # --- LOCAL UTILITIES (merge, uv, TODOs, prints, HEAD markers, file hygiene) ---
  - repo: local
    hooks:
      # 1) Check your branch merges cleanly with origin/main (dry-run).
      - id: check-merge-with-main
        name: Check merge compatibility with origin/main
        language: system
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            git fetch origin
            git merge --no-commit --no-ff origin/main || { echo "Merge conflicts detected with origin/main"; exit 1; }
            git merge --abort
            echo "Merge check passed (no conflicts with origin/main)"
        stages: [manual]
        pass_filenames: false

      # 2) Ensure dependencies are synchronized (uv sync) if you use uv.
      - id: uv-sync
        name: Ensure dependencies are synchronized (uv sync)
        language: system
        entry: uv
        args: ["sync"]
        stages: [manual]
        pass_filenames: false

      # 3) Check for TODO/FIXME/XXX only in staged changes.
      - id: check-todos-in-diff
        name: Check for TODO/FIXME/XXX in staged changes
        language: system
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            if git diff --cached | grep -E '^\+.*\b(TODO|FIXME|XXX)\b'; then
              echo "Found TODO/FIXME/XXX in staged changes."
              echo "Tip: convert to a tracked issue and reference it, or remove before committing."
              exit 1
            fi
            echo "No TODO/FIXME/XXX found in staged changes."
        pass_filenames: false
        stages: [manual]

      # 4) Guardrails for accidental prints (staged diff only).
      - id: forbid-print
        name: Check for leftover print() in staged diff
        language: system
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            if git diff --cached | grep -E '^\+.*\bprint\s*\('; then
              echo "Found added print() statements in staged changes."
              exit 1
            fi
            echo "No print() found in staged changes."
        stages: [manual]
        pass_filenames: false

      # 5) Forbid committing certain tracked files.
      - id: forbid-certain-tracked-files
        name: Forbid committing files that should be gitignored
        entry: bash
        language: system
        args:
          - -c
          - |
            set -euo pipefail
            BAD=$(git diff --cached --name-only | grep -E '\.(pyc|pyo)$|\.DS_Store$|\.env$|\.ipynb_checkpoints' || true)
            if [ -n "$BAD" ]; then
              echo "You committed files that should be in .gitignore:"
              echo "$BAD"
              exit 1
            fi
            echo "No undesired tracked files"
        pass_filenames: false
        stages: [manual]

      # 6) Check for 'HEAD' markers (often sign of bad merge).
      - id: check-for-head-marker
        name: Check for 'HEAD' appearing in staged files
        language: system
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            if git diff --cached | grep -E 'HEAD'; then
              echo "Found 'HEAD' in staged changes!"
              echo "This usually indicates unresolved merge conflict markers."
              exit 1
            fi
            echo "No 'HEAD' found in staged changes."
        pass_filenames: false
        stages: [manual]