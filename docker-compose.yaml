services:
  # local stack container for local testing of AWS services
  # initialises with localscript-setup.sh
  localstack:
    container_name: "tsp_localstack"
    image: localstack/localstack:3.4
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      - SERVICES=s3
      - DEBUG=${DEBUG:-0}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./bin/localstack-setup.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "./parquet-data:/var/lib/localstack/parquet-data"
      - "./flux-data:/var/lib/localstack/flux-data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566"]
      interval: 10s
      timeout: 5s
      retries: 2
  pushgateway:
    image: prom/pushgateway
    ports:
      - 9091:9091
  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    links:
      - pushgateway:pushgateway
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
